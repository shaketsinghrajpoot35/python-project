<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Static Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <header class="glass-panel">
            <h1>Welcome to the Future</h1>
            <p>A simple yet stunning static project built with HTML, CSS, and JS.</p>
            <button id="action-btn" class="glow-btn">Interact With Me</button>
        </header>

        <main class="content-grid">
            <div class="card glass-panel">
                <h2>Design Aesthetics</h2>
                <p>Featuring modern glassmorphism, vibrant gradients, and smooth typography.</p>
            </div>
            <div class="card glass-panel">
                <h2>Dynamic Interactions</h2>
                <p>Click the button above to see the subtle Javascript animations in action.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
